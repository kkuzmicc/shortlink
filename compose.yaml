services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortlink_dev}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      LINK_MANAGEMENT_DB_PASSWORD: ${LINK_MANAGEMENT_DB_PASSWORD:-link_management_dev}
      REDIRECT_DB_PASSWORD: ${REDIRECT_DB_PASSWORD:-redirect_dev}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics_dev}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

  service-link-management:
    build: ./backend-quarkus/service-link-management

    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/link_management_db
      QUARKUS_DATASOURCE_USERNAME: link_management
      QUARKUS_DATASOURCE_PASSWORD: ${LINK_MANAGEMENT_DB_PASSWORD:-link_management_dev}

    ports:
      - "127.0.0.1:${LINK_MANAGEMENT_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  service-redirect:
    build: ./backend-quarkus/service-redirect

    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/redirect_db
      QUARKUS_DATASOURCE_USERNAME: redirect
      QUARKUS_DATASOURCE_PASSWORD: ${REDIRECT_DB_PASSWORD:-redirect_dev}

    ports:
      - "127.0.0.1:${REDIRECT_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  service-analytics:
    build: ./backend-quarkus/service-analytics

    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/analytics_db
      QUARKUS_DATASOURCE_USERNAME: analytics
      QUARKUS_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics_dev}

    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend-angular
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"

volumes:
  postgres_data:
